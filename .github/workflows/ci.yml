name: ci

on:
  pull_request:
  push:
    branches: [work, main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: apps/delivery_suite
      - run: flutter analyze
        working-directory: apps/delivery_suite
      - uses: supabase/setup-cli@v1
      - run: supabase db lint --linked=false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/order_simulator.js && node --check scripts/gps_simulator.js && node --check scripts/supabase_client.js
